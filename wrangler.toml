name = "world-of-sports"
main = "worker/index.js"
compatibility_date = "2026-09-30"

[build]
command = "npm run build"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "world-of-sports"

# Every 6 hours keeps the Strava API cache well inside the 7-day retention limit.
[triggers]
crons = ["0 */6 * * *"]

# Secrets (npx wrangler secret put NAME), never committed:
# ACCESS_TEAM_DOMAIN, ACCESS_AUD, STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET, STRAVA_REFRESH_TOKEN,
# TRAINHEROIC_EMAIL, TRAINHEROIC_PASSWORD, INITIAL_SNAPSHOT (optional first-run seed)
